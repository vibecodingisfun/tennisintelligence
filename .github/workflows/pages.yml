name: Deploy site

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e72093dfebf574464e272ad29812c022
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RAW="${{ github.head_ref }}"
          else
            RAW="${{ github.ref_name }}"
          fi
          if [ "$RAW" = "main" ]; then
            BRANCH=main
          else
            BRANCH=$(printf '%s' "$RAW" | tr '/' '-')
          fi
          set +e
          OUT=$(npx --yes wrangler@4 pages deploy . \
            --project-name tennisintelligence \
            --branch "$BRANCH" \
            --commit-hash "${{ github.sha }}" \
            --commit-message "Deploy from GitHub Actions" 2>&1)
          CODE=$?
          set -e
          printf '%s\n' "$OUT"
          URL=$(printf '%s\n' "$OUT" | awk '/https:\/\/.*pages.dev/ {url=$NF} END {print url}')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          exit $CODE
      - name: Comment with the preview URL
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body "$(cat <<EOF
          Preview: ${{ steps.deploy.outputs.url }}

          Branch alias: https://${{ steps.deploy.outputs.branch }}.tennisintelligence.pages.dev
          EOF
          )"
